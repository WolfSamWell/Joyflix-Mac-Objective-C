<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyflix</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 顶部工具栏 -->
  <div id="toolbar">
    <h1>🦀 Joyflix</h1>
  </div>

  <!-- 站点选择区域 -->
  <div id="sites-container">
    <h2>选择站点</h2>
    <div id="builtin-sites" class="sites-grid"></div>
    <h3>自定义站点</h3>
    <div id="custom-sites" class="sites-grid"></div>
    <div class="add-site">
      <input type="text" id="new-site-name" placeholder="站点名称">
      <input type="text" id="new-site-url" placeholder="站点URL">
      <button id="btn-add-site">添加</button>
    </div>
  </div>

  <!-- 历史记录面板 -->
  <div id="history-panel" class="panel hidden">
    <div class="panel-header">
      <h3>观影记录</h3>
      <button class="close-btn">×</button>
    </div>
    <div class="panel-content">
      <div id="history-list"></div>
      <button id="btn-clear-history">清除历史</button>
    </div>
  </div>

  <script src="utils/inject.js"></script>
  <script src="utils/history.js"></script>
  <script src="utils/monitor.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
